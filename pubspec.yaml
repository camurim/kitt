name: kitturbo
description: K.i.t.Turbo — Assistente veicular Flutter inspirado no K.I.T.T. com Gemini Live API, Android Auto, telemetria real e controle de voz.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.1
  flutter_pcm_sound: ^3.1.2
  record: ^6.1.1
  permission_handler: ^11.3.1
  audioplayers: ^6.1.0
  url_launcher: ^6.3.1
  flutter_phone_direct_caller: ^2.2.1
  shared_preferences: ^2.3.2
  path_provider: ^2.1.5
  flutter_compass: ^0.8.1
  sensors_plus: ^6.1.1
  geolocator: ^13.0.2
  wakelock_plus: ^1.2.8
  audio_session: ^0.1.25

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Descomente abaixo caso adicione áudios/imagens próprios em assets/
  # assets:
  #   - assets/audio/
  #   - assets/images/
